services:
  agri-vision:
    ports: []

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      agri-vision:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      AGRI_VISION_DOMAIN: ${AGRI_VISION_DOMAIN:?configure AGRI_VISION_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
